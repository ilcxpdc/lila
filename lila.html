<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Lila 💙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===== WHERE TO EDIT (see also the CONTENT object in the script) =====
   1. All texts / messages  -> CONTENT object at the top of the <script>
   2. Cover images (page 5) -> CONTENT.futureCards[i].img  (e.g. "img/travel.jpg")
   3. Music                 -> <audio id="music" src="music.mp3">
   4. Colors                -> CSS variables just below
   ================================================================== */
:root{
  --sky:#BFE3F7; --sky2:#A9D6F5; --white:#FFFFFF;
  --pink:#F9C9DD; --pink2:#FADADD; --ink:#3A4A63;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Poppins',sans-serif;color:var(--ink);background:linear-gradient(180deg,#fff 0%,var(--sky) 100%) fixed;overflow:hidden;line-height:1.6}
h1,h2{font-family:'Playfair Display',serif;font-weight:700;line-height:1.25}

/* ---- background floaters ---- */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float{position:absolute;bottom:-60px;animation:rise linear forwards;opacity:.0}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.8}100%{transform:translateY(-115vh) rotate(40deg);opacity:0}}
.cloud{position:absolute;width:140px;height:44px;background:#fff;border-radius:50px;opacity:.7;filter:blur(1px);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60px;height:60px;top:-28px;left:22px}
.cloud::after{width:46px;height:46px;top:-18px;left:70px}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(110vw)}}

/* ---- pages ---- */
.page{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px 56px;text-align:center;overflow-y:auto;opacity:0;visibility:hidden;transform:translateX(40px);
  transition:opacity .6s ease,transform .6s ease,visibility .6s}
.page.active{opacity:1;visibility:visible;transform:none}
.page.leaving{transform:translateX(-40px)}
.inner{width:100%;max-width:460px;margin:auto}
h1{font-size:clamp(1.8rem,7vw,2.5rem);margin-bottom:12px}
h2{font-size:clamp(1.5rem,6vw,2rem);margin-bottom:20px}
.sub{font-size:.9rem;opacity:.8;margin-bottom:28px}

/* ---- glass card ---- */
.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 10px 30px rgba(120,160,200,.25);padding:24px 20px}

/* ---- buttons ---- */
.btn{font:500 1.05rem 'Poppins',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--pink),var(--pink2));
  border:none;border-radius:50px;min-height:54px;padding:14px 34px;margin:8px;cursor:pointer;
  box-shadow:0 6px 18px rgba(249,201,221,.9);transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.95)}
.btn:hover{box-shadow:0 8px 26px rgba(249,160,200,.8)}
.btn.ghost{background:#fff;box-shadow:0 4px 14px rgba(169,214,245,.8)}
.btn.dodging{position:fixed;z-index:50;margin:0;transition:left .25s ease,top .25s ease}
.btn.hidden{display:none}
.btn.appear{animation:pop .6s ease}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.card{position:relative;cursor:pointer;border:none;font:500 1rem 'Poppins',sans-serif;color:var(--ink);
  min-height:96px;border-radius:22px;padding:14px;background:rgba(255,255,255,.75);
  box-shadow:0 8px 22px rgba(120,160,200,.28);transition:transform .25s,box-shadow .25s;overflow:hidden}
.card:active{transform:scale(.96)}
.card:last-child:nth-child(odd){grid-column:1/-1}
.card.opened{background:linear-gradient(135deg,var(--pink2),#fff);box-shadow:0 8px 22px rgba(249,160,200,.55)}
.card.opened::after{content:"💗";position:absolute;top:6px;right:10px;font-size:.9rem}
.card.photo{aspect-ratio:1/1.15;min-height:0;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;
  background-size:cover;background-position:var(--pos,center)}
.card.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(58,74,99,.55))}
.card.photo span{position:relative}
.card.photo.opened{outline:3px solid var(--pink)}

/* ---- modal ---- */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(58,74,99,.35);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.35s}
#modal.show{opacity:1;visibility:visible}
#modal .glass{background:rgba(255,255,255,.95);max-width:440px;width:100%;max-height:80vh;overflow-y:auto;
  transform:scale(.85) translateY(20px);transition:transform .35s}
#modal.show .glass{transform:none}
#modal h2{font-size:1.5rem;margin-bottom:12px}
#modal p{text-align:left;margin-bottom:10px}

/* ---- apology / final text ---- */
.lines p{opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s;margin-bottom:12px;font-size:1.02rem}
.lines p.in{opacity:1;transform:none}
#finalText{text-shadow:0 0 18px rgba(249,201,221,1),0 0 6px rgba(255,255,255,1);animation:glow 3s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 8px rgba(249,201,221,.6)}to{text-shadow:0 0 22px rgba(249,160,200,1),0 0 6px #fff}}
.sign{font-family:'Playfair Display',serif;font-style:italic;font-size:2rem;margin-top:12px}

/* ---- UI chrome ---- */
#dots{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:9px;z-index:40}
#dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--sky2);transition:.4s}
#dots i.on{background:var(--pink);transform:scale(1.4);box-shadow:0 0 8px var(--pink)}
#mute{position:fixed;top:14px;right:14px;z-index:70;width:44px;height:44px;border-radius:50%;border:none;font-size:1.2rem;
  background:rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(120,160,200,.4);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="bg"></div>
<button id="mute" aria-label="Mute or unmute music">🔇</button>
<audio id="music" src="music.mp3" loop preload="auto"></audio>

<!-- 1 -->
<section class="page active" data-page="0"><div class="inner glass">
  <h1 id="p1Title"></h1><p class="sub" id="p1Sub"></p>
  <button class="btn" id="yes1"></button>
  <button class="btn ghost" id="no1"></button>
</div></section>

<!-- 2 -->
<section class="page" data-page="1"><div class="inner">
  <h2 id="p2Title"></h2>
  <div class="grid" id="grid2"></div>
  <button class="btn hidden" id="next2"></button>
</div></section>

<!-- 3 -->
<section class="page" data-page="2"><div class="inner glass">
  <h2 id="p3Title"></h2>
  <div class="lines" id="apology"></div>
  <button class="btn hidden" id="next3"></button>
</div></section>

<!-- 4 -->
<section class="page" data-page="3"><div class="inner glass">
  <h1 id="p4Title"></h1>
  <button class="btn" id="yes4"></button>
  <button class="btn ghost" id="no4"></button>
</div></section>

<!-- 5 -->
<section class="page" data-page="4"><div class="inner">
  <h2 id="p5Title"></h2>
  <div class="grid" id="grid5"></div>
  <button class="btn hidden" id="next5"></button>
</div></section>

<!-- 6 -->
<section class="page" data-page="5"><div class="inner glass">
  <div class="lines" id="finalText"></div>
  <div class="sign" id="sign"></div>

<div id="modal"><div class="glass"><h2 id="mTitle"></h2><p id="mText"></p><button class="btn" id="mClose">Close</button></div></div>
<div id="dots"></div>

/* ================= END OF EDITABLE CONTENT ================= */

const $ = s => document.querySelector(s);
const pages = [...document.querySelectorAll('.page')];
let current = 0;

/* ---- dots ---- */
pages.forEach(() => $('#dots').appendChild(document.createElement('i')));
function setDots(){ [...$('#dots').children].forEach((d,i)=>d.classList.toggle('on',i===current)); }

/* ---- floating hearts, sparkles, clouds ---- */
const SYMBOLS = ['💗','🤍','💖','✨','🩷'];
function spawn(){
  const e = document.createElement('div');
  e.className = 'float';
  e.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
  e.style.left = Math.random()*100 + 'vw';
  e.style.fontSize = (14 + Math.random()*22) + 'px';
  e.style.animationDuration = (7 + Math.random()*8) + 's';
  $('#bg').appendChild(e);
  setTimeout(()=>e.remove(), 16000);
}
let rate = 900, timer;
function startHearts(){ clearInterval(timer); timer = setInterval(spawn, rate); }
for(let i=0;i<3;i++){
  const c = document.createElement('div');
  c.className='cloud'; c.style.top = (8+i*22)+'%';
  c.style.animationDuration = (60+i*25)+'s'; c.style.animationDelay = (-i*20)+'s';
  $('#bg').appendChild(c);
}
startHearts();

/* ---- page navigation ---- */
function go(n){
  const old = pages[current];
  old.classList.add('leaving'); old.classList.remove('active');
  setTimeout(()=>old.classList.remove('leaving'), 650);
  current = n;
  pages[n].classList.add('active');
  pages[n].scrollTop = 0;
  setDots();
  if(n===2) typeLines($('#apology'), CONTENT.p3.text, ()=>reveal($('#next3')));
  if(n===5){ typeLines($('#finalText'), CONTENT.p6.text, ()=>{ $('#sign').textContent = CONTENT.p6.sign; }); rate = 250; startHearts(); }
}
function reveal(btn){ btn.classList.remove('hidden'); btn.classList.add('appear'); }
setDots();

/* ---- line-by-line fade-in ---- */
function typeLines(box, text, done){
  box.innerHTML = '';
  const parts = text.replace(/\s+/g,' ').split(/(?<=[.!;,])\s+/);
  const chunks = []; let buf = '';
  parts.forEach(p => { buf += (buf?' ':'') + p; if(buf.length > 55){ chunks.push(buf); buf=''; } });
  if(buf) chunks.push(buf);
  chunks.forEach((c,i) => {
    const p = document.createElement('p'); p.textContent = c; box.appendChild(p);
    setTimeout(()=>p.classList.add('in'), 500 + i*1400);
  });
  setTimeout(()=>done && done(), 500 + chunks.length*1400 + 600);
}

/* ---- dodging "No" button ---- */
function makeDodge(btn, texts){
  let tries = 0;
  function jump(e){
    if(e && e.cancelable) e.preventDefault();
    tries++;
    btn.classList.add('dodging');
    const w = btn.offsetWidth, h = btn.offsetHeight, m = 8;
    const maxX = window.innerWidth - w - m, maxY = window.innerHeight - h - m;
    btn.style.left = Math.max(m, Math.random()*maxX) + 'px';
    btn.style.top  = Math.max(m, Math.random()*maxY) + 'px';
    if(tries >= 3) btn.textContent = texts[(tries-3) % texts.length];
  }
  ['mouseover','pointerenter','touchstart','pointerdown','click'].forEach(ev =>
    btn.addEventListener(ev, jump, {passive:false}));
  window.addEventListener('resize', () => { if(btn.classList.contains('dodging')) jump(); });
}

/* ---- cards + modal ---- */
function buildCards(grid, data, nextBtn, photo){
  let opened = 0;
  data.forEach(c => {
    const b = document.createElement('button');
    b.className = 'card' + (photo ? ' photo' : '');
    if(photo && c.img){ b.style.backgroundImage = `url("${c.img}")`; if(c.pos) b.style.setProperty('--pos', c.pos); }
    if(photo && !c.img) b.style.background = 'linear-gradient(135deg,var(--sky2),var(--pink))';
    b.innerHTML = `<span>${c.label}</span>`;
    b.addEventListener('click', () => {
      showModal(c.title, c.text);
      if(!b.classList.contains('opened')){
        b.classList.add('opened'); opened++;
        if(opened === data.length) reveal(nextBtn);
      }
    });
    grid.appendChild(b);
  });
}
function showModal(t, x){ $('#mTitle').textContent = t; $('#mText').textContent = x; $('#modal').classList.add('show'); }
$('#mClose').onclick = () => $('#modal').classList.remove('show');
$('#modal').addEventListener('click', e => { if(e.target.id==='modal') $('#modal').classList.remove('show'); });

/* ---- music (starts on first click) ---- */
const music = $('#music'); let muted = false;
document.addEventListener('pointerdown', function first(){
  music.volume = .6; music.play().then(()=>$('#mute').textContent='🔊').catch(()=>{});
  document.removeEventListener('pointerdown', first);
});
$('#mute').onclick = e => {
  e.stopPropagation(); muted = !muted;
  if(muted) music.pause(); else music.play().catch(()=>{});
  $('#mute').textContent = muted ? '🔇' : '🔊';
};

/* ---- wire up the content ---- */
const C = CONTENT;
$('#p1Title').textContent = C.p1.title; $('#p1Sub').textContent = C.p1.sub;
$('#yes1').textContent = C.p1.yes; $('#no1').textContent = C.p1.no;
$('#yes1').onclick = () => go(1); makeDodge($('#no1'), C.p1.noTexts);

$('#p2Title').textContent = C.p2.title; $('#next2').textContent = C.p2.next;
buildCards($('#grid2'), C.p2.cards, $('#next2'), false);
$('#next2').onclick = () => go(2);

$('#p3Title').textContent = C.p3.title; $('#next3').textContent = C.p3.next;
$('#next3').onclick = () => go(3);

$('#p4Title').textContent = C.p4.title;
$('#yes4').textContent = C.p4.yes; $('#no4').textContent = C.p4.no;
$('#yes4').onclick = () => go(4); makeDodge($('#no4'), C.p4.noTexts);

$('#p5Title').textContent = C.p5.title; $('#next5').textContent = C.p5.next;
buildCards($('#grid5'), C.p5.cards, $('#next5'), true);
$('#next5').onclick = () => go(5);
</script>
